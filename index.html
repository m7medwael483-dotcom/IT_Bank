  {type:'tf',q:"Servers cannot provide services to other computers.",ans:false,exp:"خطأ ❌ — الخوادم (Servers) مُصمَّمة خصيصاً لتقديم الخدمات للحاسبات الأخرى (العملاء) على الشبكة."},

  // ── PAGE 7 MCQ ──
  {type:'mcq',q:"A computer is a machine that:",opts:["Only stores data","Only displays data","Only inputs data","Processes data into information"],ans:3,exp:"الإجابة: Processes data into information ✅ — الحاسوب يأخذ البيانات الخام ويعالجها لإنتاج معلومات مفيدة."},
  {type:'mcq',q:"CPU is responsible for:",opts:["Processing","Input","Output","Storage"],ans:0,exp:"الإجابة: Processing ✅ — المعالج المركزي مسؤول عن معالجة وتنفيذ التعليمات والبيانات."},
  {type:'mcq',q:"RAM is:",opts:["Permanent","Temporary","Optical","External"],ans:1,exp:"الإجابة: Temporary ✅ — RAM مؤقتة تفقد محتواها عند إيقاف الجهاز.",tip:"💡 لو شفت RAM → Volatile (مؤقتة تُمسح عند الإيقاف)."},
  {type:'mcq',q:"ROM stands for:",opts:["Read Only Memory","Random Only Memory","Run Only Memory","Read Open Memory"],ans:0,exp:"الإجابة: Read Only Memory ✅ — ذاكرة القراءة فقط، تحتوي على بيانات ثابتة لا تُمحى عند إيقاف الجهاز."},
  {type:'mcq',q:"Input device example:",opts:["Printer","Monitor","Keyboard","Speaker"],ans:2,exp:"الإجابة: Keyboard ✅ — لوحة المفاتيح جهاز إدخال. أما Printer وMonitor وSpeaker فأجهزة إخراج."},
  {type:'mcq',q:"Output device example:",opts:["Mouse","Keyboard","Scanner","Monitor"],ans:3,exp:"الإجابة: Monitor ✅ — الشاشة جهاز إخراج تعرض المعلومات للمستخدم. Mouse وKeyboard وScanner أجهزة إدخال."},
  {type:'mcq',q:"HDD is used for:",opts:["Temporary storage","Permanent storage","Processing","Input"],ans:1,exp:"الإجابة: Permanent storage ✅ — القرص الصلب للتخزين الدائم طويل الأمد للبيانات والبرامج."},
  {type:'mcq',q:"CD-ROM capacity is smaller than:",opts:["DVD","USB","RAM","Cache"],ans:0,exp:"الإجابة: DVD ✅ — CD ≈700MB وهي أصغر من DVD ≈4.7GB."},
  {type:'mcq',q:"Primary storage is:",opts:["Permanent","Temporary","External","Optical"],ans:1,exp:"الإجابة: Temporary ✅ — التخزين الأولي (RAM) مؤقت ومتطاير."},
  {type:'mcq',q:"Secondary storage is:",opts:["Temporary","Volatile","Internal only","Long-term"],ans:3,exp:"الإجابة: Long-term ✅ — التخزين الثانوي دائم وطويل الأمد."},
  {type:'mcq',q:"LAN connects:",opts:["Local area","Worldwide","Countries","Continents"],ans:0,exp:"الإجابة: Local area ✅ — LAN شبكة محلية تربط أجهزة في منطقة محدودة كمبنى أو مكتب."},
  {type:'mcq',q:"MAN connects:",opts:["Same building","Same city","Whole world","Single device"],ans:1,exp:"الإجابة: Same city ✅ — MAN (Metropolitan Area Network) شبكة تربط أجهزة في مدينة واحدة."},
  {type:'mcq',q:"WAN connects:",opts:["Small area","Large distances","One computer","One room"],ans:1,exp:"الإجابة: Large distances ✅ — WAN (Wide Area Network) تربط شبكات عبر مسافات جغرافية كبيرة."},
  {type:'mcq',q:"Internet is:",opts:["Single network","Collection of networks","Device","Software"],ans:1,exp:"الإجابة: Collection of networks ✅ — الإنترنت مجموعة من الشبكات المترابطة حول العالم."},
  {type:'mcq',q:"TCP/IP is used for:",opts:["Storage","Communication","Input","Output"],ans:1,exp:"الإجابة: Communication ✅ — TCP/IP بروتوكولات الاتصال الأساسية على الإنترنت."},
  {type:'mcq',q:"ISP stands for:",opts:["Internet Service Provider","Internal System Processor","Input Service Program","Internet System Protocol"],ans:0,exp:"الإجابة: Internet Service Provider ✅ — مزود خدمة الإنترنت، الشركة التي تُتيح الاتصال بالإنترنت.",tip:"💡 لو شفت ISP → Internet Service Provider، الشركة اللي بتوفر الإنترنت."},
  {type:'mcq',q:"FTP is used for:",opts:["Email","File transfer","Chat","Browsing"],ans:1,exp:"الإجابة: File transfer ✅ — FTP (File Transfer Protocol) بروتوكول نقل الملفات بين الأجهزة عبر الشبكة."},
  {type:'mcq',q:"WWW stands for:",opts:["World Wide Web","Wide Web World","Web World Wide","World Wide World Web Wide"],ans:0,exp:"الإجابة: World Wide Web ✅ — الشبكة العنكبوتية العالمية، نظام المعلومات المبني على الإنترنت."},
  {type:'mcq',q:"Server is:",opts:["Input device","Output device","Service provider computer","Storage only"],ans:2,exp:"الإجابة: Service provider computer ✅ — الخادم (Server) حاسوب يُقدّم خدمات وموارد للأجهزة الأخرى (العملاء) على الشبكة."},
  {type:'mcq',q:"Supercomputer is:",opts:["Small computer","Low performance","Very powerful computer","Portable device"],ans:2,exp:"الإجابة: Very powerful computer ✅ — Supercomputer الأقوى في الأداء، يُستخدم في الأبحاث العلمية وتحليل البيانات الضخمة."},

  // ── PAGE 8 TRUE/FALSE ──
  {type:'tf',q:"The CPU consists of two main parts: the Control Unit and the ALU.",ans:true,exp:"صح ✅ — المعالج المركزي مُكوَّن أساساً من وحدة التحكم (Control Unit) ووحدة الحساب والمنطق (ALU)."},
  {type:'tf',q:"The CPU can process data directly from a disk without moving it to memory.",ans:false,exp:"خطأ ❌ — يجب نقل البيانات إلى RAM أولاً قبل أن يتمكن المعالج من معالجتها. لا يستطيع المعالج الوصول مباشرة للقرص."},
  {type:'tf',q:"Registers are high-speed temporary storage areas located within the CPU.",ans:true,exp:"صح ✅ — السجلات (Registers) وحدات تخزين مؤقتة فائقة السرعة موجودة داخل المعالج نفسه لتخزين البيانات أثناء المعالجة."},
  {type:'tf',q:"The Instruction Time (I-time) is the time it takes the ALU to execute an instruction.",ans:false,exp:"خطأ ❌ — I-time هو وقت جلب وفك تشفير التعليمة (Fetch + Decode). أما وقت التنفيذ فيُسمى E-time (Execution Time)."},
  {type:'tf',q:"A Kilobyte is exactly 1000 bytes.",ans:false,exp:"خطأ ❌ — 1 Kilobyte = 1024 bytes (2^10). الحاسوب يعتمد النظام الثنائي وليس العشري."},
  {type:'tf',q:"The system clock synchronizes the operations of the computer.",ans:true,exp:"صح ✅ — ساعة النظام (System Clock) تُزامن جميع عمليات الحاسوب وتحدد سرعة المعالج."},
  {type:'tf',q:"ASCII is the most widely used coding scheme on personal computers.",ans:true,exp:"صح ✅ — ASCII هو نظام الترميز الأكثر استخداماً في الحاسبات الشخصية لتمثيل النصوص الإنجليزية."},
  {type:'tf',q:"RAM is non-volatile, meaning it keeps its data when the power is turned off.",ans:false,exp:"خطأ ❌ — RAM متطايرة (Volatile) تفقد بياناتها عند إيقاف الجهاز. غير المتطايرة هي ROM وFlash وHDD."},
  {type:'tf',q:"RISC technology uses a small subset of instructions to increase speed.",ans:true,exp:"صح ✅ — RISC (Reduced Instruction Set Computing) تستخدم مجموعة صغيرة من التعليمات البسيطة لتحقيق سرعة أعلى."},
  {type:'tf',q:"Pipelining is the process of using multiple processors at once to solve a problem.",ans:false,exp:"خطأ ❌ — Pipelining تقنية تُغذّي تعليمة جديدة في كل مرحلة من دورة المعالج قبل انتهاء السابقة. المعالجة المتوازية هي استخدام معالجات متعددة."},
  {type:'tf',q:"Unicode was designed to accommodate alphabets with more than 256 characters.",ans:true,exp:"صح ✅ — Unicode صُمِّم لتجاوز قيود ASCII (128 حرف) ودعم لغات العالم التي تحتوي على أكثر من 256 رمز."},
  {type:'tf',q:"The motherboard is the circuit board that holds the CPU and other electronic components.",ans:true,exp:"صح ✅ — اللوحة الأم (Motherboard) هي الدارة الرئيسية التي تحمل المعالج والذاكرة وبطاقات التوسعة وتربطها معاً."},
  {type:'tf',q:"Cache Level 1 (L1) is usually faster and more expensive than Level 2 (L2) cache.",ans:true,exp:"صح ✅ — L1 Cache الأسرع والأصغر والأغلى، موجودة داخل المعالج مباشرة. L2 أكبر وأبطأ قليلاً."},
  {type:'tf',q:"Control Unit is responsible for executing arithmetic operations like addition and subtraction.",ans:false,exp:"خطأ ❌ — العمليات الحسابية (جمع، طرح) مهمة ALU. وحدة التحكم تُوجّه وتُنسّق التعليمات فقط."},
  {type:'tf',q:"Binary system uses only two digits: 0 and 1.",ans:true,exp:"صح ✅ — النظام الثنائي (Binary) يستخدم رقمين فقط: 0 و1، وهو الأساس الذي تعمل به الحاسبات."},
  {type:'tf',q:"MIPS stands for Millions of Instructions Per Second.",ans:true,exp:"صح ✅ — MIPS مقياس لأداء المعالج يُعبّر عن عدد الملايين من التعليمات التي يُنفّذها في الثانية."},
  {type:'tf',q:"A Megabyte is roughly one billion bytes.",ans:false,exp:"خطأ ❌ — 1 Megabyte ≈ مليون byte (1,048,576 bytes). المليار byte هو Gigabyte تقريباً."},
  {type:'tf',q:"The Control Unit decodes instructions during the machine cycle.",ans:true,exp:"صح ✅ — في دورة التعليمات، وحدة التحكم تجلب التعليمة (Fetch) ثم تفك شفرتها (Decode) لتحديد العملية المطلوبة."},
  {type:'tf',q:"ROM stands for Random Only Memory.",ans:false,exp:"خطأ ❌ — ROM تعني Read-Only Memory (ذاكرة القراءة فقط). Random Access Memory هي RAM."},
  {type:'tf',q:"Parallel processing involves a control processor dividing a problem into parts.",ans:true,exp:"صح ✅ — المعالجة المتوازية تعتمد على معالج تحكم يُقسّم المشكلة إلى أجزاء تُعالَج في آنٍ واحد بمعالجات متعددة."},
  {type:'tf',q:"The system bus speed is typically measured in Megahertz (MHz).",ans:true,exp:"صح ✅ — سرعة ناقل النظام (System Bus) تُقاس بـMHz، وتؤثر على سرعة نقل البيانات بين المعالج والذاكرة."},
  {type:'tf',q:"CISC stands for Complex Instruction Set Computing.",ans:true,exp:"صح ✅ — CISC نهج تصميم معالج يستخدم مجموعة كبيرة من التعليمات المعقدة. معظم معالجات Intel وAMD تعتمده."},
  {type:'tf',q:"The Store step in the machine cycle saves results back into the RAM.",ans:true,exp:"صح ✅ — مرحلة Store (التخزين) في دورة التعليمات تحفظ نتائج العمليات مجدداً في الذاكرة (RAM)."},
  {type:'tf',q:"Secondary storage is used for long-term storage and is not lost when power is off.",ans:true,exp:"صح ✅ — التخزين الثانوي (HDD, SSD, Flash) غير متطاير، يحتفظ بالبيانات حتى بعد إيقاف الجهاز."},
  {type:'tf',q:"Each memory location has a unique address referred to by a number.",ans:true,exp:"صح ✅ — كل خلية ذاكرة لها عنوان فريد (Memory Address) يستخدمه المعالج للوصول المباشر لها."},

  // ── PAGE 8 MCQ ──
  {type:'mcq',q:"Which unit directs the computer system to execute stored program instructions?",opts:["ALU","Control Unit","RAM","ROM"],ans:1,exp:"الإجابة: Control Unit ✅ — وحدة التحكم تُوجّه الحاسوب لتنفيذ التعليمات المخزّنة وتُنسّق بين مكوّناته."},
  {type:'mcq',q:"Which of the following is an arithmetic operation?",opts:["Equal-to","Less-than","Multiplication","Greater-than"],ans:2,exp:"الإجابة: Multiplication ✅ — الضرب عملية حسابية. أما Equal-to وLess-than وGreater-than فعمليات منطقية مقارنة."},
  {type:'mcq',q:"High-speed temporary storage areas within the CPU are called:",opts:["Hard drives","RAM","Buses","Registers"],ans:3,exp:"الإجابة: Registers ✅ — السجلات وحدات تخزين مؤقتة فائقة السرعة داخل المعالج لتخزين البيانات أثناء المعالجة."},
  {type:'mcq',q:"The time required to fetch, decode, execute, and store an operation is called:",opts:["Clock speed","Machine cycle","Bus speed","Access time"],ans:1,exp:"الإجابة: Machine cycle ✅ — دورة الآلة (Machine Cycle) هي الوقت اللازم لإكمال دورة كاملة: Fetch→Decode→Execute→Store."},
  {type:'mcq',q:"Which coding scheme uses 16 bits and can represent 65,536 possible values?",opts:["ASCII","EBCDIC","Unicode","Binary"],ans:2,exp:"الإجابة: Unicode ✅ — Unicode يستخدم 16 bit مما يتيح تمثيل 2^16 = 65,536 رمزاً مختلفاً."},
  {type:'mcq',q:"Roughly one trillion bytes is a:",opts:["Gigabyte","Terabyte","Megabyte","Kilobyte"],ans:1,exp:"الإجابة: Terabyte ✅ — 1 Terabyte ≈ تريليون byte (1,099,511,627,776 byte بالضبط)."},
  {type:'mcq',q:"Which processor technology requires complex operations to be broken into smaller steps?",opts:["CISC","Parallel","Pipelining","RISC"],ans:3,exp:"الإجابة: RISC ✅ — RISC يُفكّك العمليات المعقدة إلى تعليمات بسيطة صغيرة لزيادة السرعة."},
  {type:'mcq',q:"The internal cache built directly into the microprocessor is:",opts:["Level 1","Level 2","Level 3","RAM"],ans:0,exp:"الإجابة: Level 1 ✅ — L1 Cache مدمجة مباشرة في المعالج، الأسرع والأصغر والأغلى."},
  {type:'mcq',q:"The physical electrical paths that transport data between the CPU and memory are the:",opts:["Registers","Pipelining","Ports","System Bus"],ans:3,exp:"الإجابة: System Bus ✅ — ناقل النظام هو المسارات الكهربائية التي تنقل البيانات بين المعالج والذاكرة والمكوّنات الأخرى."},
  {type:'mcq',q:"The ALU tests for which of the following logical conditions?",opts:["Equal-to","Addition","Storage size","Clock speed"],ans:0,exp:"الإجابة: Equal-to ✅ — ALU تُنفّذ اختبارات منطقية كـEqual-to وLess-than وGreater-than إضافة للعمليات الحسابية."},
  {type:'mcq',q:"Which step of the machine cycle involves saving the result in RAM?",opts:["Fetch","Decode","Execute","Store"],ans:3,exp:"الإجابة: Store ✅ — مرحلة Store هي آخر خطوة في دورة الآلة، تحفظ نتيجة العملية في الذاكرة."},
  {type:'mcq',q:"Microprocessor speeds are usually expressed today in:",opts:["MHz","GHz","MIPS","Teraflops"],ans:1,exp:"الإجابة: GHz ✅ — سرعة المعالجات الحديثة تُقاس بـGHz (جيجاهرتز). مثلاً: 3.5 GHz."},
  {type:'mcq',q:"Which type of memory must be continuously refreshed by the CPU?",opts:["SRAM","ROM","PROM","DRAM"],ans:3,exp:"الإجابة: DRAM ✅ — الذاكرة الديناميكية العشوائية (DRAM) تحتاج إلى تحديث مستمر (Refresh) لإعادة شحن خلاياها."},
  {type:'mcq',q:"A variation of traditional serial processing that feeds a new instruction at each step is:",opts:["Parallel processing","Multi-tasking","Pipelining","RISC"],ans:2,exp:"الإجابة: Pipelining ✅ — تقنية Pipelining تُغذّي تعليمة جديدة في كل مرحلة من مراحل المعالج قبل انتهاء السابقة."},
  {type:'mcq',q:"Which component is the most important on the motherboard?",opts:["Power supply","CPU (Microprocessor)","Expansion slots","Ports"],ans:1,exp:"الإجابة: CPU (Microprocessor) ✅ — المعالج هو أهم مكوّن على اللوحة الأم لأنه يُنفّذ جميع التعليمات."},
  {type:'mcq',q:"How many bits are in one byte?",opts:["4","8","16","32"],ans:1,exp:"الإجابة: 8 ✅ — 1 Byte = 8 bits. هذا المعيار الأساسي في علم الحاسوب."},
  {type:'mcq',q:"Which memory chip contains programs permanently recorded at the factory?",opts:["RAM","Hard Disk","DVD","ROM"],ans:3,exp:"الإجابة: ROM ✅ — ROM تحتوي على برامج مُخزَّنة بشكل دائم منذ التصنيع (مثل BIOS)."},
  {type:'mcq',q:"Instruction time (I-time) includes which steps?",opts:["Decode and Store","Execute and Store","Fetch and Execute","Fetch and Decode"],ans:3,exp:"الإجابة: Fetch and Decode ✅ — I-time (Instruction Time) يشمل مرحلتَي Fetch وDecode. أما Execute وStore فيُشكّلان E-time."},
  {type:'mcq',q:"What measures the ability of a computer to perform complex mathematical operations?",opts:["MIPS","Megaflop","Bus width","GHz"],ans:1,exp:"الإجابة: Megaflop ✅ — Megaflop (MFLOPS) يقيس قدرة الحاسوب على إجراء عمليات الفاصلة العائمة المعقدة."},
  {type:'mcq',q:"Parallel processing is often measured in:",opts:["Megabytes","Milliseconds","Volts","Teraflops"],ans:3,exp:"الإجابة: Teraflops ✅ — الـSupercomputers والمعالجة المتوازية تُقاس بـTeraflops (تريليون عملية فاصلة عائمة في الثانية)."},
  {type:'mcq',q:"Expansion boards connect to the motherboard via:",opts:["Registers","ALU","Expansion slots","Cache"],ans:2,exp:"الإجابة: Expansion slots ✅ — بطاقات التوسعة (GPU, Sound card) تتصل باللوحة الأم عبر فتحات التوسعة (PCIe slots)."},
  {type:'mcq',q:"Which type of RAM is faster and used today?",opts:["DRAM","SDRAM","PROM","EBCDIC"],ans:1,exp:"الإجابة: SDRAM ✅ — SDRAM (Synchronous DRAM) أسرع من DRAM التقليدية لأنها مُزامَنة مع ساعة النظام."},
  {type:'mcq',q:"When data is written back to a memory address, what happens to previous contents?",opts:["Added to existing data","The address is changed","Sent to the ALU","The previous contents are destroyed"],ans:3,exp:"الإجابة: The previous contents are destroyed ✅ — عند الكتابة في عنوان ذاكرة، تُستبدل البيانات القديمة بالجديدة وتُفقد تلقائياً."},
  {type:'mcq',q:"The number of electrical paths to carry data is called:",opts:["Bus speed","Bus width","Bus length","Bus port"],ans:1,exp:"الإجابة: Bus width ✅ — عرض الناقل (Bus Width) هو عدد المسارات الكهربائية المتوازية لنقل البيانات، يُحدد كمية البيانات المنقولة دفعة واحدة."},

  // ── PAGE 9-10 TRUE/FALSE ──
  {type:'tf',q:"A computer program is a set of instructions that a computer can execute.",ans:true,exp:"صح ✅ — البرنامج مجموعة تعليمات مكتوبة بلغة برمجية يُنفّذها الحاسوب لإنجاز مهمة معينة."},
  {type:'tf',q:"Software is the physical part of the computer system.",ans:false,exp:"خطأ ❌ — البرمجيات (Software) هي الجزء غير المادي (التعليمات والبرامج). الجزء المادي هو الـHardware."},
  {type:'tf',q:"An algorithm must be written in a specific programming language.",ans:false,exp:"خطأ ❌ — الخوارزمية مستقلة عن أي لغة برمجية، يمكن التعبير عنها بالكلام العادي أو Pseudocode أو مخطط انسيابي."},
  {type:'tf',q:"The Design phase in the Software Life Cycle involves coding the program.",ans:false,exp:"خطأ ❌ — مرحلة التصميم (Design) تشمل وضع الخوارزميات والمخططات الانسيابية. الكتابة الفعلية للكود تكون في مرحلة Coding."},
  {type:'tf',q:"Machine language is the only language that a computer can understand directly.",ans:true,exp:"صح ✅ — لغة الآلة (0 و1) هي اللغة الوحيدة التي يفهمها المعالج مباشرة دون الحاجة لمترجم."},
  {type:'tf',q:"Assembly language uses binary codes (0s and 1s) for instructions.",ans:false,exp:"خطأ ❌ — لغة التجميع تستخدم رموزاً مختصرة (Mnemonics) كـMOV وADD. أما 0 و1 فهي لغة الآلة."},
  {type:'tf',q:"High-level languages are easier for humans to read and write than low-level languages.",ans:true,exp:"صح ✅ — اللغات عالية المستوى كـPython وJava أقرب للغة البشرية وأسهل في القراءة والكتابة والصيانة."},
  {type:'tf',q:"A Compiler translates the entire program into machine code at once.",ans:true,exp:"صح ✅ — المترجم (Compiler) يُترجم البرنامج كاملاً دفعة واحدة إلى لغة الآلة. بعكس Interpreter الذي يُترجم سطراً بسطر."},
  {type:'tf',q:"In a flowchart, a rectangle symbol represents a decision point.",ans:false,exp:"خطأ ❌ — المستطيل في المخطط الانسيابي يُمثّل عملية (Process). نقطة القرار تُمثَّل بالمعيّن (Diamond)."},
  {type:'tf',q:"Pseudocode is a formal programming language with strict syntax rules.",ans:false,exp:"خطأ ❌ — Pseudocode شبه كود غير رسمي يُستخدم لوصف الخوارزمية بلغة شبه إنسانية دون قواعد صارمة."},
  {type:'tf',q:"The main() function is the entry point of every C++ program.",ans:true,exp:"صح ✅ — main() هي نقطة الدخول الإلزامية لكل برنامج C++، منها يبدأ التنفيذ."},
  {type:'tf',q:"The #include directive is used for input and output operations.",ans:false,exp:"خطأ ❌ — #include توجيه يُدرج ملف مكتبة. العمليات الفعلية للإدخال والإخراج تُنفَّذ بدوال كـcin وcout من مكتبة <iostream>."},
  {type:'tf',q:"In C++, the semicolon (;) is used to mark the end of a statement.",ans:true,exp:"صح ✅ — الفاصلة المنقوطة (;) إلزامية في نهاية كل جملة في C++، وإغفالها يُسبّب Syntax Error."},
  {type:'tf',q:"Variable names in C++ can start with a number.",ans:false,exp:"خطأ ❌ — أسماء المتغيرات يجب أن تبدأ بحرف أو (_). البدء برقم يُسبّب خطأ في الصياغة."},
  {type:'tf',q:"The keyword 'const' defines a variable whose value cannot be changed.",ans:true,exp:"صح ✅ — const يُعرّف ثابتاً (Constant)، قيمته ثابتة لا تتغير طوال البرنامج. مثل: const int MAX = 100;"},
  {type:'tf',q:"Logic errors cause a program to crash during execution.",ans:false,exp:"خطأ ❌ — أخطاء المنطق (Logic Errors) لا تُوقف البرنامج لكنها تُنتج نتائج خاطئة. الأخطاء التي تُوقف البرنامج هي Runtime Errors."},
  {type:'tf',q:"A flowchart Parallelogram is used for Input/Output operations.",ans:true,exp:"صح ✅ — شكل متوازي الأضلاع (Parallelogram) في المخطط الانسيابي يُمثّل عمليات الإدخال والإخراج."},
  {type:'tf',q:"The Testing phase ensures the program meets the specified requirements.",ans:true,exp:"صح ✅ — مرحلة الاختبار (Testing) تتحقق من أن البرنامج يعمل بشكل صحيح ويُلبّي متطلبات المستخدم."},
  {type:'tf',q:"Low-level languages are machine-dependent.",ans:true,exp:"صح ✅ — اللغات المنخفضة المستوى (لغة الآلة والتجميع) مرتبطة بنوع المعالج ولا تعمل على أجهزة أخرى دون تعديل."},
  {type:'tf',q:"Compiling a C++ program creates an executable (.exe) file.",ans:true,exp:"صح ✅ — عملية الترجمة الكاملة (Compile + Link) تُنتج ملفاً تنفيذياً (.exe على Windows) يمكن تشغيله مباشرة."},
  {type:'tf',q:"Integer (int) data type is used for storing decimal numbers.",ans:false,exp:"خطأ ❌ — int للأعداد الصحيحة (بدون فاصلة). للأعداد العشرية نستخدم float أو double."},
  {type:'tf',q:"The Software Life Cycle starts with the Problem Definition phase.",ans:true,exp:"صح ✅ — دورة حياة البرمجيات تبدأ بتحديد المشكلة (Problem Definition) ثم التحليل فالتصميم فالبرمجة فالاختبار فالصيانة."},
  {type:'tf',q:"'Cin' is used to output data to the screen in C++.",ans:false,exp:"خطأ ❌ — cin للإدخال (Input). الإخراج إلى الشاشة يكون بـcout. مثال: cout << \"Hello\";"},
  {type:'tf',q:"Maintenance is the final phase of the Software Life Cycle.",ans:true,exp:"صح ✅ — الصيانة (Maintenance) هي آخر مرحلة في دورة حياة البرمجيات، تشمل تصحيح الأخطاء وإضافة ميزات جديدة."},
  {type:'tf',q:"Assemblers are used to translate High-Level languages.",ans:false,exp:"خطأ ❌ — Assembler يُترجم لغة التجميع (Assembly Language) فقط. اللغات عالية المستوى تحتاج Compiler أو Interpreter."},

  // ── PAGE 10 MCQ ──
  {type:'mcq',q:"What is the first phase of the Software Life Cycle?",opts:["Design","Problem Definition","Coding","Testing"],ans:1,exp:"الإجابة: Problem Definition ✅ — أولى مراحل دورة حياة البرمجيات هي تحديد وفهم المشكلة المراد حلها."},
  {type:'mcq',q:"Which of the following is a characteristic of an algorithm?",opts:["It must be written in C++","It is a finite set of steps","It must use a compiler","It is hardware-dependent"],ans:1,exp:"الإجابة: It is a finite set of steps ✅ — الخوارزمية مجموعة محدودة من الخطوات المنطقية، مستقلة عن اللغة أو الجهاز."},
  {type:'mcq',q:"Which language generation is known as Machine Language?",opts:["1GL","2GL","3GL","4GL"],ans:0,exp:"الإجابة: 1GL ✅ — الجيل الأول (1GL) هو لغة الآلة (Binary). 2GL=Assembly, 3GL=High-level, 4GL=Non-procedural."},
  {type:'mcq',q:"The diamond shape in a flowchart represents:",opts:["Process","Start/End","Decision","Input/Output"],ans:2,exp:"الإجابة: Decision ✅ — المعيّن (Diamond) يُمثّل نقطة قرار (If/Else). المستطيل=عملية، البيضاوي=بداية/نهاية، متوازي الأضلاع=إدخال/إخراج."},
  {type:'mcq',q:"Which translator converts code line-by-line during execution?",opts:["Compiler","Assembler","Linker","Interpreter"],ans:3,exp:"الإجابة: Interpreter ✅ — المُفسِّر يُترجم البرنامج سطراً بسطر أثناء التنفيذ. بعكس Compiler الذي يُترجم الكل دفعة واحدة."},
  {type:'mcq',q:"In C++, which symbol is used for single-line comments?",opts:["/*","//","#","--"],ans:1,exp:"الإجابة: // ✅ — // للتعليق على سطر واحد في C++. أما /* */ فللتعليقات متعددة الأسطر."},
  {type:'mcq',q:"Which data type is best for storing a single character like 'A'?",opts:["int","float","char","string"],ans:2,exp:"الإجابة: char ✅ — char يُستخدم لتخزين حرف واحد. string لسلسلة أحرف، int للأعداد الصحيحة، float للعشرية."},
  {type:'mcq',q:"Which phase involves fixing bugs found after the software is released?",opts:["Development","Analysis","Maintenance","Design"],ans:2,exp:"الإجابة: Maintenance ✅ — مرحلة الصيانة تشمل إصلاح الأخطاء المكتشفة بعد الإصدار وإضافة تحسينات."},
  {type:'mcq',q:"What does IDE stand for?",opts:["Integrated Development Environment","Internal Design Environment","International Data Engineering","Integrated Desktop Entry"],ans:0,exp:"الإجابة: Integrated Development Environment ✅ — بيئة التطوير المتكاملة تجمع المحرر والمترجم والمُصحّح في أداة واحدة. مثل: VS Code, Eclipse."},
  {type:'mcq',q:"A Syntax Error is:",opts:["A mistake in the logic of the program","A violation of the language's grammar rules","An error that happens during calculation","A hardware failure"],ans:1,exp:"الإجابة: A violation of the language's grammar rules ✅ — خطأ الصياغة يحدث عند كسر قواعد اللغة (نسيان ;، خطأ في الكتابة)."},
  {type:'mcq',q:"Which of the following is a valid C++ variable name?",opts:["2nd_Value","total-sum","_count","class"],ans:2,exp:"الإجابة: _count ✅ — يبدأ بـ(_) وهو مسموح. 2nd_Value يبدأ برقم، total-sum يحتوي (-) غير مسموح، class كلمة محجوزة.",tip:"💡 لو السؤال عن valid variable name → ابحث عن اللي يبدأ بحرف أو _، بدون مسافات أو رموز أو أرقام في الأول."},
  {type:'mcq',q:"Which header file is required for using math functions like sqrt?",opts:["<math.h>","<stdio.h>","<ctype.h>","<fstream.h>"],ans:0,exp:"الإجابة: <math.h> ✅ — math.h (أو <cmath>) تحتوي دوال رياضية كـsqrt() وpow() وabs().",tip:"💡 لو شفت math functions (sqrt, pow) → <math.h> أو <cmath>."},
  {type:'mcq',q:"The float data type typically uses how many bytes?",opts:["2","4","8","16"],ans:1,exp:"الإجابة: 4 bytes ✅ — float يشغل 4 bytes (32 bit). أما double فيشغل 8 bytes لدقة أعلى.",tip:"💡 لو شفت float + bytes → 4 bytes. double = 8 bytes."},
  {type:'mcq',q:"What is the purpose of the Analysis phase?",opts:["Writing the code","Understanding what the user needs","Creating the user interface","Deleting old files"],ans:1,exp:"الإجابة: Understanding what the user needs ✅ — مرحلة التحليل تهدف لفهم متطلبات المستخدم وتحديد ما يحتاجه النظام.",tip:"💡 لو شفت Analysis phase → Understanding what the user needs (فهم المتطلبات)."},
  {type:'mcq',q:"Which shape starts and ends a flowchart?",opts:["Rectangle","Diamond","Circle","Oval (Terminal)"],ans:3,exp:"الإجابة: Oval (Terminal) ✅ — الشكل البيضاوي أو الأسطوانة المستديرة يُمثّل بداية ونهاية المخطط الانسيابي.",tip:"💡 لو شفت starts + ends + flowchart → Oval/Terminal (الشكل البيضاوي)."},
  {type:'mcq',q:"3rd Generation Languages (3GL) are also called:",opts:["Natural languages","Procedural languages","Object-oriented languages","Assembly languages"],ans:1,exp:"الإجابة: Procedural languages ✅ — لغات الجيل الثالث (C, Pascal, FORTRAN) تُسمى اللغات الإجرائية لأنها تصف كيفية تنفيذ الخطوات.",tip:"💡 لو شفت 3GL → Procedural languages (إجرائية) مثل C وPascal."},
  {type:'mcq',q:"Which of these is NOT a low-level language?",opts:["C++","Machine language","Assembly language","All of the above are low-level"],ans:0,exp:"الإجابة: C++ ✅ — C++ لغة عالية المستوى (High-level). اللغات المنخفضة هي Machine Language وAssembly Language.",tip:"💡 لو شفت NOT low-level → C++ (هي High-level). Machine وAssembly = Low-level."},
  {type:'mcq',q:"The escape sequence '\\n' in C++ is used for:",opts:["Tab space","New line","Backspace","Audible bell"],ans:1,exp:"الإجابة: New line ✅ — \\n تُحرّك المؤشر لسطر جديد. \\t=tab، \\b=backspace، \\a=bell.",tip:"💡 لو شفت \n → New line (سطر جديد). \t = tab, \b = backspace."},
  {type:'mcq',q:"What is a Named Constant?",opts:["A variable that changes frequently","A memory location with a fixed value","A function name","A type of error"],ans:1,exp:"الإجابة: A memory location with a fixed value ✅ — الثابت المُسمّى (const) موقع ذاكرة له قيمة ثابتة لا تتغير طوال البرنامج.",tip:"💡 لو شفت Named Constant → A memory location with a fixed value."},
  {type:'mcq',q:"Which operator is used for assignment in C++?",opts:["==",";","->","="],ans:3,exp:"الإجابة: = ✅ — = لتعيين القيمة (Assignment). أما == فللمقارنة (Comparison). مثال: x = 5; // تعيين.",tip:"💡 لو شفت assignment operator → = (علامة واحدة). == للمقارنة مش التعيين."},
  {type:'mcq',q:"Documentation is important because:",opts:["It makes the program run faster","It helps others understand and maintain the code","It is required by the compiler","It reduces memory usage"],ans:1,exp:"الإجابة: It helps others understand and maintain the code ✅ — التوثيق يُسهّل على المبرمجين الآخرين فهم الكود وصيانته.",tip:"💡 لو شفت Documentation → helps others understand and maintain the code."},
  {type:'mcq',q:"What does the linker do?",opts:["Finds syntax errors","Translates pseudocode","Executes the program","Connects object code with library code"],ans:3,exp:"الإجابة: Connects object code with library code ✅ — الرابط (Linker) يربط الكود الكائني بالمكتبات اللازمة لإنتاج الملف التنفيذي.",tip:"💡 لو شفت linker → Connects object code with library code."},
  {type:'mcq',q:"Which data type would you use for true or false values?",opts:["int","double","bool","char"],ans:2,exp:"الإجابة: bool ✅ — نوع البيانات bool يُستخدم للقيم المنطقية (true أو false) في C++.",tip:"💡 لو شفت true/false values → bool دايماً."},
  {type:'mcq',q:"In the Design phase, developers often use:",opts:["Compilers","Keyboards","Flowcharts and Pseudocode","Hard drives"],ans:2,exp:"الإجابة: Flowcharts and Pseudocode ✅ — في مرحلة التصميم يستخدم المبرمجون المخططات الانسيابية وشبه الكود لتوضيح منطق البرنامج.",tip:"💡 لو شفت Design phase + developers → Flowcharts and Pseudocode."},
  {type:'mcq',q:"The output of a compiler is called:",opts:["Source code","Object code","Pseudocode","Algorithm"],ans:1,exp:"الإجابة: Object code ✅ — الكود الكائني (Object Code) هو الناتج من المترجم، يكون بصيغة قريبة من لغة الآلة ثم يُربط بالمكتبات.",tip:"💡 لو شفت output of compiler → Object code."}
];

let filter = 'all';
let sideFilter = 'all'; // 'all' | 'correct' | 'wrong'
let visibleQ = [];
let currentIdx = 0;
let answers = {};

function setFilter(f){
  filter = f;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  buildVisible();
  currentIdx = 0;
  render();
}

function buildVisible(){
  if(filter==='all') visibleQ = ALL.map((_,i)=>i);
  else visibleQ = ALL.map((_,i)=>i).filter(i=>ALL[i].type===filter);
}

function isQCorrect(qi){
  const a=answers[qi]; const q=ALL[qi];
  if(a===undefined) return false;
  if(q.type==='tf') return a===true;
  return a===q.ans;
}
function isQWrong(qi){
  const a=answers[qi]; const q=ALL[qi];
  if(a===undefined) return false;
  if(q.type==='tf') return a===false;
  return a!==q.ans;
}

function buildPnums(){
  const c = document.getElementById('pnums');
  c.innerHTML='';
  const mc = document.getElementById('mob-pnums');
  if(mc) mc.innerHTML='';
  // update active state of sf buttons (desktop + mobile)
  ['correct','wrong'].forEach(f=>{
    const btn=document.getElementById('sfbtn-'+f);
    if(btn) btn.classList.toggle('active', sideFilter===f);
    const mbtn=document.getElementById('mob-sfbtn-'+f);
    if(mbtn) mbtn.classList.toggle('active', sideFilter===f);
  });
  // show/hide mobile "show all" button
  const mobAll = document.getElementById('mob-sfbtn-all');
  if(mobAll) mobAll.classList.toggle('visible', sideFilter!=='all');
  visibleQ.forEach((qi,vi)=>{
    const d = document.createElement('div');
    const correct = isQCorrect(qi);
    const wrong   = isQWrong(qi);
    // hide based on sideFilter
    let hidden = false;
    if(sideFilter==='correct' && !correct) hidden=true;
    if(sideFilter==='wrong'   && !wrong)   hidden=true;
    let cls = 'pnum';
    if(hidden) cls+=' hidden';
    if(vi===currentIdx) cls+=' current';
    if(correct) cls+=' correct';
    else if(wrong) cls+=' wrong';
    d.className=cls;
    d.textContent=vi+1;
    d.onclick=()=>{currentIdx=vi;render();};
    c.appendChild(d);
    // also add to mobile drawer pnums
    if(mc){
      const dm = d.cloneNode(true);
      dm.onclick=()=>{currentIdx=vi;closeDrawer();render();};
      mc.appendChild(dm);
    }
    if(vi===currentIdx && !hidden){
      setTimeout(()=>d.scrollIntoView({block:'nearest',behavior:'smooth'}),50);
    }
  });
}

function updateStats(){
  const total = visibleQ.length;
  const correct = visibleQ.filter(qi=>{
    const a=answers[qi]; const q=ALL[qi];
    if(q.type==='tf') return a===true;
    return a===q.ans;
  }).length;
  const wrong = visibleQ.filter(qi=>{
    const a=answers[qi]; if(a===undefined) return false;
    const q=ALL[qi];
    if(q.type==='tf') return a===false;
    return a!==q.ans;
  }).length;
  const answered= correct+wrong;
  document.getElementById('s-q').textContent = currentIdx+1;
  document.getElementById('s-total').textContent = total;
  document.getElementById('s-cor').textContent = correct;
  document.getElementById('s-wrg').textContent = wrong;
  const pct = Math.round((answered/total)*100);
  document.getElementById('fill').style.width = pct+'%';
  // mini bars
  const corPct = total>0 ? Math.round((correct/total)*100) : 0;
  const wrgPct = total>0 ? Math.round((wrong/total)*100) : 0;
  document.getElementById('bar-correct').style.width = corPct+'%';
  document.getElementById('bar-wrong').style.width = wrgPct+'%';
  document.getElementById('bar-cor-count').textContent = correct;
  document.getElementById('bar-wrg-count').textContent = wrong;
  // mobile bar sync
  const mc=document.getElementById('mob-cor'); if(mc) mc.textContent=correct;
  const mw=document.getElementById('mob-wrg'); if(mw) mw.textContent=wrong;
  const mbc=document.getElementById('mob-bar-correct'); if(mbc) mbc.style.width=corPct+'%';
  const mbw=document.getElementById('mob-bar-wrong'); if(mbw) mbw.style.width=wrgPct+'%';
  const mbcc=document.getElementById('mob-bar-cor-count'); if(mbcc) mbcc.textContent=correct;
  const mbwc=document.getElementById('mob-bar-wrg-count'); if(mbwc) mbwc.textContent=wrong;
}

function render(){
  updateStats();
  buildPnums();
  if(visibleQ.length===0){document.getElementById('main').innerHTML='<p style="text-align:center;color:var(--muted);padding:2rem">No questions.</p>';return;}
  const qi = visibleQ[currentIdx];
  const q  = ALL[qi];
  const done = answers[qi]!==undefined;

  if(q.type==='tf') renderTF(qi,q,done);
  else renderMCQ(qi,q,done);
}

function renderTF(qi,q,done){
  const st = answers[qi]; // true=correct false=wrong
  let tCls='', fCls='';
  if(done){
    if(q.ans===true){ tCls='correct'; if(st===false) fCls='wrong'; }
    else { fCls='correct'; if(st===false) tCls='wrong'; }
  }
  document.getElementById('main').innerHTML=`
    <div class="q-card tf">
      <div class="q-meta">
        <span class="q-index tf">Q ${currentIdx+1} / ${visibleQ.length}</span>
        <span class="q-type">True / False</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="tf-row">
        <button class="ans-btn ${tCls}" onclick="answerTF(${qi},true)"  ${done?'disabled':''}>✔ True</button>
        <button class="ans-btn ${fCls}" onclick="answerTF(${qi},false)" ${done?'disabled':''}>✘ False</button>
      </div>
      <div class="explanation ${done?'show':''}">
        <div class="exp-label">📖 Explanation</div>
        ${done ? (()=>{
          const userWasCorrect = answers[qi]===true;
          const userClicked = userWasCorrect ? q.ans : !q.ans;
          const chosenLabel = userClicked ? 'True' : 'False';
          const correctLabel = q.ans ? 'True' : 'False';
          return '<div class="exp-chosen ' + (userWasCorrect?'chosen-correct':'chosen-wrong') + '">'
            + '<span class="chosen-icon">' + (userWasCorrect?'✅':'❌') + '</span>'
            + '<span>اخترت: <strong>' + chosenLabel + '</strong></span>'
            + (!userWasCorrect ? '<span class="chosen-correct-ans"> — الإجابة الصحيحة: <strong>' + correctLabel + '</strong></span>' : '')
            + '</div>';
        })() : ''}
        ${q.exp}
        ${q.tip ? '<div class="exp-tip"><div class="tip-label">🎯 Exam Tip</div>' + q.tip + '</div>' : ''}
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="go(-1)" ${currentIdx===0?'disabled':''}>← Previous</button>
      <button class="nav-btn" onclick="go(1)">${currentIdx===visibleQ.length-1?'🏁 Results':'Next →'}</button>
    </div>`;
}

function renderMCQ(qi,q,done){
  const st = answers[qi]; // undefined | correct index stored as 'correct' or chosen index
  const chosen = done ? answers[qi] : null;
  const optsHTML = q.opts.map((o,i)=>{
    let cls='opt-btn';
    if(done){
      if(i===q.ans) cls+=' correct';
      else if(i===chosen && chosen!==q.ans) cls+=' wrong';
    }
    const lbl = ['A','B','C','D'][i];
    return `<button class="${cls}" onclick="answerMCQ(${qi},${i})" ${done?'disabled':''}><span class="opt-label">${lbl}</span>${o}</button>`;
  }).join('');
  document.getElementById('main').innerHTML=`
    <div class="q-card mcq">
      <div class="q-meta">
        <span class="q-index mcq">Q ${currentIdx+1} / ${visibleQ.length}</span>
        <span class="q-type">MCQ</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="mcq-opts">${optsHTML}</div>
      <div class="explanation ${done?'show':''}">
        <div class="exp-label">📖 Explanation</div>
        ${done ? (()=>{
          const chosen = answers[qi];
          const isCorrect = chosen === q.ans;
          const labels = ['A','B','C','D'];
          const chosenLabel = labels[chosen] + ' — ' + q.opts[chosen];
          const correctLabel = labels[q.ans] + ' — ' + q.opts[q.ans];
          return '<div class="exp-chosen ' + (isCorrect?'chosen-correct':'chosen-wrong') + '">'
            + '<span class="chosen-icon">' + (isCorrect?'✅':'❌') + '</span>'
            + '<span>اخترت: <strong>' + chosenLabel + '</strong></span>'
            + (!isCorrect ? '<span class="chosen-correct-ans"> — الإجابة الصحيحة: <strong>' + correctLabel + '</strong></span>' : '')
            + '</div>';
        })() : ''}
        ${q.exp}
        ${q.tip ? '<div class="exp-tip"><div class="tip-label">🎯 Exam Tip</div>' + q.tip + '</div>' : ''}
      </div>
    </div>
    <div class="nav-row">
      <button class="nav-btn" onclick="go(-1)" ${currentIdx===0?'disabled':''}>← Previous</button>
      <button class="nav-btn" onclick="go(1)">${currentIdx===visibleQ.length-1?'🏁 Results':'Next →'}</button>
    </div>`;
}

function answerTF(qi,val){
  if(answers[qi]!==undefined) return;
  answers[qi] = (val===ALL[qi].ans);
  render();
}

function answerMCQ(qi,chosen){
  if(answers[qi]!==undefined) return;
  answers[qi] = chosen; // store chosen index
  render();
}

function go(dir){
  const next = currentIdx+dir;
  if(next<0) return;
  if(next>=visibleQ.length){showResult();return;}
  currentIdx=next;
  render();
}

function showResult(){
  const total   = visibleQ.length;
  const correct = visibleQ.filter(qi=>{
    const a=answers[qi]; const q=ALL[qi];
    if(q.type==='tf') return a===true;
    return a===q.ans;
  }).length;
  const wrong   = visibleQ.filter(qi=>{
    const a=answers[qi]; const q=ALL[qi];
    if(a===undefined) return false;
    if(q.type==='tf') return a===false;
    return a!==q.ans;
  }).length;
  const skipped = total-correct-wrong;
  const pct = Math.round((correct/total)*100);
  let grade,color;
  if(pct>=90){grade='🏆 Excellent!';color='var(--green)';}
  else if(pct>=75){grade='🎉 Very Good';color='var(--accent)';}
  else if(pct>=60){grade='👍 Good';color='var(--amber)';}
  else{grade='📚 Needs Revision';color='var(--red)';}

  // section breakdown
  const tfQ   = visibleQ.filter(qi=>ALL[qi].type==='tf');
  const mcqQ  = visibleQ.filter(qi=>ALL[qi].type==='mcq');
  const tfC   = tfQ.filter(qi=>answers[qi]===true).length;
  const mcqC  = mcqQ.filter(qi=>answers[qi]===ALL[qi].ans).length;

  document.getElementById('main').innerHTML=`
    <div class="result-wrap">
      <div class="result-circle" style="border-color:${color};color:${color}">${pct}%</div>
      <div class="result-title" style="color:${color}">${grade}</div>
      <div class="result-sub">You answered ${correct+wrong} of ${total} questions</div>
      <div class="result-grid">
        <div class="result-stat"><div class="result-stat-val" style="color:var(--green)">${correct}</div><div class="result-stat-lbl">Correct</div></div>
        <div class="result-stat"><div class="result-stat-val" style="color:var(--red)">${wrong}</div><div class="result-stat-lbl">Wrong</div></div>
        <div class="result-stat"><div class="result-stat-val" style="color:var(--muted)">${skipped}</div><div class="result-stat-lbl">Skipped</div></div>
      </div>
      ${tfQ.length&&mcqQ.length?`<div class="section-scores">
        <div class="section-row"><span class="section-name">True / False</span><span class="section-val" style="color:var(--accent)">${tfC} / ${tfQ.length}</span></div>
        <div class="section-row"><span class="section-name">MCQ</span><span class="section-val" style="color:var(--amber)">${mcqC} / ${mcqQ.length}</span></div>
      </div>`:''}
      <button class="restart-btn" onclick="restart()">🔄 Restart Quiz</button>
    </div>`;
  buildPnums();
  updateStats();
}

function toggleDrawer(){
  const d=document.getElementById('mob-drawer');
  const o=document.getElementById('mob-overlay');
  const b=document.getElementById('mob-drawer-btn');
  const isOpen=d.classList.contains('open');
  if(isOpen){ closeDrawer(); }
  else { d.classList.add('open'); o.classList.add('open'); b.classList.add('open'); }
}
function closeDrawer(){
  document.getElementById('mob-drawer')?.classList.remove('open');
  document.getElementById('mob-overlay')?.classList.remove('open');
  document.getElementById('mob-drawer-btn')?.classList.remove('open');
}

function setSideFilter(f){
  sideFilter = (sideFilter===f) ? 'all' : f; // toggle
  buildPnums();
}

function showAll(){
  sideFilter = 'all';
  buildPnums();
}

function fullReset(){
  currentIdx=0;
  answers={};
  sideFilter='all';
  filter='all';
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelector('.tab')?.classList.add('active');
  buildVisible();
  render();
}

function restart(){
  currentIdx=0;
  answers={};
  sideFilter='all';
  render();
}

// init
buildVisible();
render();
</script>
</body>
</html>
